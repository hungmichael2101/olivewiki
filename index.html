<h1>📘 Quy định Olive</h1><p class="s">Tra cứu nhanh nội quy, quy trình và quy chế của công ty</p>
<div class="sb" style="position:sticky"><div style="position:relative"><input id="q" type="search" placeholder="Bạn muốn tìm gì? VD: nghỉ phép, làm thêm giờ, hoàn ứng…" autocomplete="off"><button id="x" hidden>✕</button></div></div>
<div class="tp" id="tp"></div>
<div id="hm"><h2 id="ht"></h2><div class="gd" id="gd"></div></div>
<div id="rs" hidden><div class="bar"><button id="bk">← Danh mục</button><span id="n"></span><button id="ex">Mở/đóng tất cả</button></div><div id="l"></div></div>
<p class="f">Nội dung là bản tóm tắt từ văn bản nội bộ, không thay thế bản gốc. Cần chính xác hãy hỏi P. HCNS.</p></div>
<script>
const DOC={a:["🤝","Tiếp nhận & thôi việc 2025",95],b:["🌴","Quy định nghỉ phép 2024",160],c:["📕","Nội quy lao động 2022",215],d:["🍳","Quy trình Khối Bếp 2024",25],e:["💰","Chấm công – tính lương",45],f:["🧾","Thanh toán tạm ứng",190],g:["🏆","Khen thưởng Bếp 2025",50],h:["⏰","Quy định chấm công 2025",280],i:["👥","Tuyển dụng 2025",330]};
const D=[
["a","Thư mời & đơn nghỉ việc","HCNS chỉ gửi thư mời nhận việc khi có xác nhận của TBP và Giám đốc. Đơn xin nghỉ việc cần QLTT đồng ý và Giám đốc phê duyệt; QLTT phải báo ngay lên Quản lý người Hàn/Giám đốc, báo muộn thì QLTT chịu chi phí phát sinh."],
["a","Văn phòng: tiếp nhận nhân viên mới","5 bước: gửi thư mời kèm danh mục hồ sơ → chuẩn bị CCDC, máy tính (≥1 ngày trước) → thu hồ sơ, ký HĐ thử việc, hội nhập, cài vân tay → TBP đánh giá thử việc (mẫu 2312.HR/ON-003) → ký HĐLĐ chính thức, lưu hồ sơ."],
["a","Văn phòng: thôi việc","Báo trước: 3 ngày (HĐ dưới 12 tháng), 30 ngày (HĐ xác định thời hạn), 45 ngày (không xác định thời hạn). Quy trình: đơn nghỉ → phương án bàn giao → bàn giao ngày làm việc cuối → quyết định thôi việc, chốt sổ BHXH trong 30–45 ngày → lưu hồ sơ."],
["a","Khối Bếp (bản 2025)","OP báo lịch đi làm trên Zalo \"[HRxOP] Quản lý Nhân sự Bếp\" chậm nhất ngày đầu. Lấy vân tay ngày đầu; gửi hồ sơ HCNS trong 7 ngày (công ty chỉ trả lương khi nộp đủ). Đánh giá GS/ĐB trong 7 ngày trước hết thử việc. Thôi việc: báo trước theo luật, quyết định trong 30 ngày."],
["b","Nguyên tắc nghỉ phép","Phải có kế hoạch, báo trước và được QLTT duyệt bằng văn bản. Ốm/đột xuất: báo điện thoại ngay, bổ sung đơn khi đi làm lại. Không báo hoặc không duyệt = nghỉ không lương. Khối VP nhắn nhóm Zalo \"Timesheet & Overtime\" sau khi QLTT duyệt."],
["b","Báo trước bao lâu?","Nghỉ 1 ngày: trước ≥1 ngày. Trên 1 đến dưới 3 ngày: trước ≥3 ngày. Trên 3 ngày: trước ≥5 ngày. QLTT phê duyệt."],
["b","Nộp đơn, thai sản, nghỉ ốm","Chỉ tính phép năm khi đơn (mẫu 01) được QLTT duyệt. VP nộp HCNS muộn nhất ngày cuối tháng; Bếp chụp gửi HCNS, bản gốc lưu tại Bếp. Thai sản: gửi đơn ≥15 ngày trước ngày dự sinh. Nghỉ ốm: nộp giấy tờ bệnh viện; nộp quá 10 ngày từ ngày ra viện thì HCNS không chịu trách nhiệm làm BHXH."],
["c","Giờ làm việc","8 giờ/ngày, 48 giờ/tuần (thứ 2–thứ 7). Văn phòng: 8h–12h và 13h–17h; nghỉ trưa không tính giờ làm; giải lao 10 phút sáng và chiều tính vào giờ làm. Bộ phận sản xuất làm theo ca (Điều 6)."],
["c","Làm thêm giờ & lương","Tối đa 4 giờ/ngày, 40 giờ/tháng, 200 giờ/năm (đặc biệt 300 giờ/năm). Lương: ngày thường ≥150%; ngày nghỉ hằng tuần ≥200%; lễ, Tết ≥300% (chưa kể lương ngày lễ). Làm đêm thêm ≥30%."],
["c","Nghỉ lễ hưởng nguyên lương","Tết Dương lịch 1 ngày; Tết Âm lịch 5 ngày; Giỗ Tổ 1 ngày; 30/4 1 ngày; 1/5 1 ngày; Quốc khánh 2 ngày. Lễ trùng ngày nghỉ thì nghỉ bù ngày làm việc kế tiếp."],
["c","Nghỉ phép năm","Đủ 12 tháng: 12 ngày (bình thường), 14 ngày (nặng nhọc, độc hại, chưa thành niên, khuyết tật), 16 ngày (đặc biệt nặng nhọc). Chưa đủ 12 tháng: theo tỷ lệ. Phép chưa nghỉ được cộng dồn đến 31/3 năm sau."],
["c","Nghỉ việc riêng & nghỉ không lương","Hưởng lương: bản thân kết hôn 3 ngày; con kết hôn 1 ngày; cha mẹ (đẻ, nuôi, vợ/chồng), vợ/chồng, con mất 3 ngày. Không lương: ½–1 ngày báo trước ≥1 ngày làm việc; 1,5–4 ngày báo trước ≥5 ngày; từ 5 ngày báo trước ≥15 ngày làm việc."],
["c","Chế độ BHXH & lao động nữ","Ốm 30–60 ngày/năm; con ốm 15–20 ngày/năm; thai sản 6 tháng; chồng nghỉ khi vợ sinh 5 ngày (7 ngày nếu mổ/sinh dưới 32 tuần). Nữ: khám thai 5 lần; nuôi con dưới 12 tháng nghỉ 60 phút/ngày; có thai từ tháng 6 không làm thêm, làm đêm."],
["c","Hợp đồng lao động","Thử việc tối đa: 6 tháng (quản lý), 60 ngày (cao đẳng trở lên), 30 ngày (trung cấp), 6 ngày (việc khác). HĐ xác định thời hạn ký tối đa 2 lần; sau đó nếu không ký lại thì mặc nhiên thành HĐ không xác định thời hạn."],
["c","Báo trước khi chấm dứt HĐLĐ","Không cần báo trước: không được bố trí đúng việc, không trả lương đúng hạn, bị ngược đãi, đủ tuổi hưu, HĐ thử việc. Cần báo bằng văn bản: 3 ngày (HĐ dưới 12 tháng), 30 ngày (12–36 tháng), 45 ngày (không xác định thời hạn)."],
["c","Lương, thưởng, phúc lợi","Lương = lương cộng phụ cấp; chuẩn 26 ngày (lương thực nhận = lương/26 × số ngày làm). Thưởng Tết 1–2 tháng lương, thưởng doanh thu giữa/cuối năm, thâm niên, đột xuất. Quà lễ Tết 100.000–1.000.000đ. Hỗ trợ ốm đau 500.000đ; nằm viện do tai nạn/bệnh tật ≤10.000.000đ. Tăng lương: theo lương tối thiểu vùng, đánh giá tháng 1, đột xuất."],
["c","Tác phong, trang phục, nghiêm cấm","Trình thẻ khi ra vào, không mượn thẻ; VP ăn mặc gọn gàng, lịch sự; sản xuất mặc đồng phục bếp. Cấm: uống rượu bia trong giờ làm, hút thuốc ngoài khu quy định, đánh bạc, ngủ trong giờ, mang vũ khí/chất cháy nổ, trộm cắp, mang tài sản/thực phẩm ra khỏi công ty."],
["c","Điện thoại, máy tính, email","Dùng cho công việc, hạn chế việc riêng. Cấm chơi game, chat việc riêng trong giờ; hạn chế USB ngoài, phải quét virus; mật khẩu và dữ liệu công ty phải bảo mật; không dùng máy in/VPP cho việc cá nhân."],
["c","An toàn lao động & PCCC","Tuân thủ quy định an toàn, dùng đúng bảo hộ, báo ngay sự cố. Có quyền từ chối làm việc khi có nguy cơ tai nạn trực tiếp. Giữ vệ sinh khu vực làm việc, tắt điện, khóa cửa trước khi về."],
["c","Bảo mật kinh doanh","Không tiết lộ, sao chép, mang ra ngoài bí mật kinh doanh/công nghệ (hợp đồng, giá, khách hàng, dữ liệu nhân sự, mật khẩu…). Phát ngôn với báo chí, đối ngoại phải được Giám đốc chấp thuận bằng văn bản."],
["c","Kỷ luật lao động","Hình thức: khiển trách (văn bản); kéo dài thời hạn nâng lương tối đa 6 tháng; cách chức; sa thải. Thời hiệu 6 tháng (12 tháng với tài chính, tài sản, bí mật). Không xử lý khi đang nghỉ ốm, nghỉ phép, bị tạm giữ; nữ mang thai, nuôi con dưới 12 tháng. Giám đốc là người có thẩm quyền."],
["c","Các trường hợp sa thải","Trộm cắp, tham ô, đánh bạc, cố ý gây thương tích, dùng ma túy tại nơi làm; tiết lộ bí mật; gây thiệt hại nghiêm trọng; tái phạm khi chưa xóa kỷ luật; tự ý bỏ việc 5 ngày cộng dồn/30 ngày hoặc 20 ngày/365 ngày không lý do chính đáng."],
["c","Bồi thường & quấy rối tình dục","Làm hư hỏng, mất tài sản: bồi thường theo lỗi; thiệt hại không nghiêm trọng bồi thường tối đa 3 tháng lương, khấu trừ không quá 30% lương/tháng. Quấy rối tình dục bị nghiêm cấm; tố cáo báo TBP/HCNS/Giám đốc, được bảo mật; xử lý đến sa thải."],
["d","Khối Bếp 2024: tiếp nhận","Báo lịch đi làm ≥1 ngày trước (không báo đúng hạn thì không tính lương những ngày đó). Lấy vân tay trong 10 ngày; gửi hồ sơ trong 7 ngày (thiếu hồ sơ bị tạm giữ lương). GS/ĐB đánh giá thử việc theo phương pháp 360 độ."],
["d","Khối Bếp 2024: thôi việc","GS/ĐB báo trước ≥15 ngày; vị trí khác báo muộn nhất ngày làm việc cuối. Không báo đủ 15 ngày có thể phát sinh 4,5% tiền thẻ BHYT. Bàn giao ngày cuối; quyết định thôi việc, chốt BHXH trong 30 ngày."],
["e","Chấm công – tính lương","Chấm vân tay 2 lần/ngày (ca gãy 4 lần) → HCNS lập bảng công (ngày 02) → xác nhận (ngày 03) → tổng hợp (ngày 05) → tính lương (ngày 08) → duyệt (ngày 09) → chi lương ngày 10 (trùng Chủ nhật thì ngày làm việc kế tiếp) → giải đáp thắc mắc trong 3 ngày. Chấm công lỗi: VP làm xác nhận chấm công; Bếp báo nhóm Zalo Nhân sự."],
["f","Hóa đơn & báo giá","Mua lẻ dưới 200.000đ: hóa đơn bán lẻ đủ tên, SĐT, địa chỉ, chữ ký người bán; tối đa 5 tờ/người/tháng. Hóa đơn phải đúng thông tin Công ty TNHH Olive (MST 0107622324). Mua CCDC văn phòng trên 5 triệu phải so sánh báo giá."],
["f","Hạn nộp & lịch thanh toán","Hồ sơ NCC thực phẩm: ngày 10 tháng sau. Công tác phí, xăng xe, VPP: trước ngày 10 tháng sau. Hoàn ứng trong 10 ngày làm việc, tối đa 30 ngày (sửa chữa máy móc ≤60 ngày làm việc). Chuyển khoản thứ 6 (món gấp thứ 3, nộp trước 12h thứ 2); tiền mặt thứ 4 và thứ 7. Chậm hồ sơ: nhân viên bị phạt chậm thanh toán 2 tuần và dừng tạm ứng; nhà cung cấp chậm 1 tháng công nợ."],
["g","Khen thưởng Bếp theo quý","Điều kiện: chi phí thực phẩm và nhân sự ≤ mục tiêu; không sự cố ATVS nghiêm trọng, cháy nổ, ngộ độc; phục vụ đúng giờ, không bị phàn nàn nghiêm trọng. Điểm đánh giá hằng tháng ≥65, trung bình quý ≥70. KPI: thực phẩm 70%, nhân sự 20%, ATVSTP 10%. Thưởng do Giám đốc quyết, thanh toán muộn nhất cuối tháng đầu quý sau."],
["h","Chấm công khối văn phòng","Chấm ≥2 lần/ngày: đến 08:00–08:05, về 16:55–17:00. Đi muộn từ 08:06 tính 30 phút, trừ lương hoặc làm bù. Tối đa 3 lần đi muộn/về sớm và 3 lần quên chấm mỗi tháng; từ lần 4 phải giải trình có TP xác nhận, GĐ duyệt. Ra ngoài, nghỉ: báo nhóm Zalo \"Timesheet & Overtime\"."],
["i","Tuyển dụng: phân quyền","Phụ bếp: BQL Bếp/Điều hành tự tuyển sau khi Trưởng nhóm điều hành duyệt, không vượt định biên; phải báo Zalo trước hoặc ngay ngày đầu, nếu không thì tự trả lương những ngày đó. Bếp chính, bếp trưởng, giám sát: cần Trưởng nhóm điều hành và Quản lý người Hàn duyệt. Vượt định biên cần Giám đốc duyệt."],
["i","Tuyển dụng: các bước","Tiếp nhận yêu cầu (phiếu đề nghị tuyển dụng) → chuẩn bị thông báo → nhận CV → sàng lọc, mời phỏng vấn → phỏng vấn (phiếu đánh giá ứng viên) → thông báo kết quả: đạt gửi Offer letter, không đạt gửi thư cảm ơn."],
["i","Tuyển dụng: bếp chính, bếp trưởng, giám sát","HCNS đăng tin, sàng lọc, gửi CV lên nhóm Zalo và tag cán bộ điều hành phỏng vấn. Điều hành báo kết quả lên nhóm Zalo (HR&OP): họ tên, vị trí, thời gian thử việc, mức lương, địa điểm, ngày bắt đầu, tag HCNS; sau đó HCNS làm quy trình tiếp nhận. Phiếu đánh giá ứng viên thang 10: dưới 5 yếu, 5–6 trung bình, 7–8 khá, 9–10 giỏi."],
["a","Phiếu đánh giá thử việc & đơn nghỉ việc","Phiếu 2312.HR/ON-003: nhân viên tự đánh giá và QLTT chấm thang 1–10 về công việc chuyên môn, kỹ năng (tổ chức, làm việc nhóm, phục vụ công việc), thái độ (hỗ trợ đồng nghiệp, tuân thủ nội quy, trách nhiệm). QLTT đề xuất: tiếp nhận / không tiếp nhận / thử việc thêm … tháng; TBP, TP.HCNS, Ban Giám đốc ký. Đơn nghỉ việc có cam kết: bàn giao đầy đủ, tuân thủ HĐLĐ, bảo mật và giữ danh tiếng công ty sau khi nghỉ."],
["b","Mẫu đơn xin nghỉ phép (mẫu 01)","Đánh dấu loại nghỉ: nghỉ phép năm; nghỉ chế độ bảo hiểm; đến muộn/về sớm; nghỉ không hưởng lương. Điền họ tên, bộ phận, ngày nghỉ, thời gian; Trưởng bộ phận xác nhận, người làm đơn ký."],
["c","Hồ sơ khi vào công ty (Điều 4)","Sơ yếu lý lịch có xác nhận địa phương (ảnh đóng dấu giáp lai); bản sao CMND/CCCD; giấy khai sinh, hộ khẩu/xác nhận cư trú; bằng cấp, chứng chỉ (nếu có); giấy khám sức khỏe từ bệnh viện huyện trở lên; sổ tài khoản VIETINBANK, sổ BHXH, mã số thuế (nếu có). Công ty nghiêm cấm giữ bản gốc bằng cấp, CCCD, sổ hộ khẩu."],
["c","Ca sản xuất (Điều 6)","Ca ngày: 7h–13h, nghỉ giữa ca 10h–10h10, ăn giữa ca 13h–14h; 14h–16h, nghỉ 15h–15h10. Ca đêm: 19h–1h, nghỉ 22h–22h10, ăn giữa ca 1h–2h; 2h–4h, nghỉ 3h–3h10. Đổi giờ làm vì lý do cá nhân/công việc phải làm đơn, có xác nhận cán bộ phụ trách và được Ban Giám đốc duyệt. (Bảng scan xoay ngang, nên đối chiếu bản gốc.)"],
["c","Làm thêm giờ: đối tượng & chấm công","Không tính lương làm thêm: cán bộ quản lý (Ban Giám đốc), người nước ngoài, vị trí cao cấp, người làm khoán. Nữ mang thai từ tháng 7 hoặc nuôi con dưới 12 tháng không làm thêm, làm đêm. Làm thêm cần người lao động đồng ý và được duyệt. Bếp: Giám sát chấm công thực tế từng ngày, gửi bảng công về văn phòng từ ngày 1 đến ngày 3 tháng sau."],
["c","Xin nghỉ & vắng mặt (Điều 11–12)","Ra ngoài giờ làm việc phải được QLTT đồng ý. Nghỉ lễ, Tết và các ngày khác phải xin phép, được cấp quản lý chấp thuận. Ốm, việc đột xuất: xin trong 1 giờ làm việc đầu tiên và bổ sung đơn ngay khi trở lại. Chứng từ nghỉ ốm hưởng BHXH nộp HCNS trong 5 ngày sau khi đi làm lại. Nghỉ không phép hoặc không đơn bị coi là nghỉ không lương."],
["c","Tạm hoãn HĐLĐ & bàn giao khi nghỉ việc","Tạm hoãn HĐLĐ tối đa 6 tháng: nghĩa vụ quân sự, bị tạm giữ/tạm giam, bị đưa vào cơ sở giáo dưỡng, lao động nữ mang thai theo xác nhận của cơ sở y tế, hoặc hai bên thỏa thuận. Trước khi nghỉ việc trong thời hạn báo trước phải bàn giao công việc, giấy tờ, sổ sách, thiết bị, đồng phục, sim/số điện thoại công ty."],
["c","Kỷ luật: khiển trách, kéo dài nâng lương, cách chức","Khiển trách (vi phạm lần đầu, mức nhẹ): không báo thay đổi hồ sơ, vi phạm giờ giấc, đi muộn/về sớm hơn 2 lần/tháng hoặc 4 lần/tháng (nữ có con dưới 7 tuổi), vi phạm an toàn, vệ sinh lao động. Kéo dài nâng lương tối đa 6 tháng: tái phạm trong 3 tháng sau khiển trách, hoặc gây thiệt hại tới lợi ích, tài sản công ty. Cách chức: nhận hoa hồng/tiền khách hàng, phân biệt đối xử, quấy rối, lăng mạ nhân viên khác, không tuân thủ chỉ đạo cấp trên."],
["c","Trình tự xử lý kỷ luật & bồi thường","Phải chứng minh lỗi; có mặt đại diện tổ chức đại diện NLĐ; NLĐ có quyền tự bào chữa; lập biên bản. Không xử lý khi đang nghỉ ốm, nghỉ phép được đồng ý, bị tạm giữ, chờ kết luận cơ quan có thẩm quyền; nữ mang thai, nghỉ thai sản, nuôi con dưới 12 tháng. Chỉ xử lý một hình thức cho nhiều hành vi (mức cao nhất). Bồi thường: họp xử lý có biên bản, thời hiệu 6 tháng; Giám đốc có thẩm quyền quyết định."],
["c","Quấy rối tình dục (Điều 42–43)","Gồm hành vi thể chất, lời nói, và qua phương tiện điện tử, ở mọi địa điểm liên quan công việc (hội thảo, đi công tác, bữa ăn, giao tiếp trực tuyến). Tố cáo báo TBP, phòng Nhân sự hoặc Giám đốc. Nguyên tắc: không khoan nhượng, nhanh chóng, bảo mật danh tính. Xử lý từ khiển trách đến sa thải; hành vi nghiêm trọng (cưỡng dâm, hiếp dâm, đe dọa) chuyển công an. Tố cáo sai sự thật bị xử lý kỷ luật; nạn nhân được bồi thường và hỗ trợ."],
["e","Hồ sơ lương hằng tháng","Hồ sơ chấm công gồm: bảng tổng hợp công, đơn nghỉ phép/ốm/thai sản, xác nhận làm thêm giờ, các xác nhận khác. Hồ sơ tính lương: bảng công, danh sách thưởng/điều chỉnh thu nhập, thông tin BHXH/BHYT/BHTN và thuế TNCN, các khoản truy lĩnh/truy thu/tạm ứng, danh sách tài khoản. Trả tiền mặt: HCNS gửi bảng cho Kế toán nhận tiền chi trực tiếp; chuyển khoản: ủy nhiệm chi và danh sách chuyển khoản (bản cứng, bản mềm)."],
["f","Hồ sơ thanh toán theo từng loại chi phí (1/2)","NCC thực phẩm công nợ: đề nghị TT của NCC, hóa đơn/bảng kê, phiếu giao hàng, HĐ nguyên tắc, đăng ký tài khoản, đề nghị TT mẫu Olive. NCC nhỏ lẻ: có thêm đề nghị tạm ứng, đề nghị mua hàng. Đầu tư xây dựng/sửa chữa bếp (P. Điều hành): hợp đồng, dự toán, báo giá so sánh, biên bản nghiệm thu, quyết toán, thanh lý HĐ. Công tác phí: kế hoạch, quyết định công tác, hóa đơn phòng nghỉ, vé di chuyển."],
["f","Hồ sơ thanh toán theo từng loại chi phí (2/2)","Khám sức khỏe (P. An toàn): kế hoạch, báo giá, danh sách có chữ ký, hóa đơn, kết quả. VPP, CCDC, chuyển phát, điện thoại, nước, mạng (P. Hành chính): đăng ký mua có chữ ký trưởng bộ phận, hóa đơn, báo giá, hình ảnh/mã tài sản. Tiếp khách: đề nghị TT và hóa đơn có bill. Hoa hồng: mỗi site, mỗi tháng 1 đề nghị riêng. Xăng xe: bảng lịch trình, ảnh km đầu/cuối. Bảo dưỡng, đăng kiểm xe: sổ theo dõi, nhật ký."],
["f","Hợp đồng & báo giá","Hợp đồng phải qua Kế toán kiểm tra điều khoản thanh toán, giao nhận, phạt trước khi trình Giám đốc; lưu 2 bản (phòng tạo HĐ và Kế toán). Báo giá phải có tên công ty, địa chỉ, SĐT, dấu; NCC thường xuyên gửi báo giá định kỳ qua mail; báo giá VPP và chuyển phát cập nhật 6 tháng/lần. Hồ sơ xây dựng chuyển Kế toán trong 10 ngày sau nghiệm thu; sai sót hóa đơn phải chỉnh muộn nhất ngày 25."],
["g","Quy trình xét thưởng Bếp","Hằng quý Phòng Điều hành cùng các bộ phận đặt cost mục tiêu. Phòng Dinh dưỡng theo dõi cost thực phẩm, HCNS theo dõi cost nhân sự. Bộ phận An toàn phối hợp Điều hành đánh giá hằng tháng theo mẫu \"site evaluation\", mỗi bếp được đánh giá tại chỗ ít nhất 1 lần/quý; An toàn tổng hợp điểm và bản cứng, gửi HCNS đề nghị thưởng muộn nhất ngày 15 tháng đầu quý sau."],
];
const norm=s=>s.split("").map(c=>/đ/i.test(c)?"d":c.normalize("NFD")[0].toLowerCase()).join("");
const I=D.map(d=>norm(d[1]+" "+d[2]+" "+DOC[d[0]][1]));let f="";
const $=i=>document.getElementById(i),q=$("q");
const TOP=["nghỉ phép","làm thêm","thôi việc","thử việc","lương","chấm công","kỷ luật","thanh toán","BHXH","thưởng"];
$("tp").innerHTML="";TOP.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{q.value=t;f="";r();scrollTo(0,0)};$("tp").appendChild(b)});
$("ht").textContent="Danh mục: "+D.length+" mục từ "+Object.keys(DOC).length+" văn bản";
Object.entries(DOC).forEach(([k,v])=>{const c=document.createElement("button");c.className="cd";c.style.setProperty("--h",v[2]);
c.innerHTML='<div class="ic">'+v[0]+'</div><b></b><span>'+D.filter(d=>d[0]===k).length+' mục</span>';c.querySelector("b").textContent=v[1];c.onclick=()=>{f=k;r()};$("gd").appendChild(c)});
function hl(el,text,t){const nt=norm(text),m=new Array(text.length).fill(0);t.forEach(w=>{let k=nt.indexOf(w);while(k>-1){for(let j=0;j<w.length;j++)m[k+j]=1;k=nt.indexOf(w,k+w.length)}});
let i=0;while(i<text.length){let j=i;while(j<text.length&&m[j]===m[i])j++;const seg=text.slice(i,j);if(m[i]){const k=document.createElement("mark");k.textContent=seg;el.appendChild(k)}else el.appendChild(document.createTextNode(seg));i=j}}
const KEY=/(\d{4}\.HR\/[A-Z]+-\d+)|(\d{1,2}h\d{0,2}(?:\s?[–-]\s?\d{1,2}h\d{0,2})?|\d{1,2}:\d{2}(?:–\d{1,2}:\d{2})?|\d[\d.,]*(?:–\d[\d.,]*)?\s?(?:%|đ|ngày làm việc|ngày|giờ|tháng|năm|tờ|lần|phút|tuần|triệu|k)(?![\p{L}]))/gu;
function fmt(el,s,t){let i=0;for(const m of s.matchAll(KEY)){hl(el,s.slice(i,m.index),t);const b=document.createElement("b");b.className=m[1]?"cd2":"k";hl(b,m[0],t);el.appendChild(b);i=m.index+m[0].length}hl(el,s.slice(i),t)}
function sp(s,c){const o=[];let d=0,b="";for(const ch of s){if(ch=="(")d++;if(ch==")")d--;if(ch==c&&!d){o.push(b.trim());b=""}else b+=ch}o.push(b.trim());return o.filter(Boolean)}
const E=(tag,cls)=>{const e=document.createElement(tag);if(cls)e.className=cls;return e};
function body(text,t){const w=E("div","ct");let ul=null;
text.split(/(?<=[^A-Z]\.)\s+(?=[A-ZÀ-ỴĐ"“\[(])/).forEach(s=>{
if(/^\(.*\)\.?$/.test(s)){ul=null;const n=E("div","nt");hl(n,s.replace(/^\(|\)\.?$/g,""),t);w.appendChild(n);return}
if(s.includes("→")){ul=null;const m=s.match(/^([^:→]{2,40}):\s+(.*)$/),rest=(m?m[2]:s).replace(/\.$/,"");
if(m){const c=E("div","cp");hl(c,m[1],t);w.appendChild(c)}
const ol=E("ol","st");rest.split("→").map(x=>x.trim()).filter(Boolean).forEach(x=>{const li=E("li");fmt(li,x[0].toUpperCase()+x.slice(1),t);ol.appendChild(li)});w.appendChild(ol);return}
if(!ul){ul=E("ul","bl");w.appendChild(ul)}const li=E("li");ul.appendChild(li);
const m=s.match(/^([^:]{2,60}):\s+(.+?)\.?$/);
if(m){let it=sp(m[2],";");if(it.length<2){it=sp(m[2],",");if(it.length<3||m[1].length>40)it=null}
if(it){const st=E("strong");hl(st,m[1]+":",t);li.appendChild(st);const u=E("ul");it.forEach(x=>{const l=E("li");fmt(l,x[0].toUpperCase()+x.slice(1),t);u.appendChild(l)});li.appendChild(u);return}
if(m[1].length<=45){const st=E("strong");hl(st,m[1]+": ",t);li.appendChild(st);fmt(li,m[2],t);return}}
fmt(li,s.replace(/\.$/,""),t)});return w}
function r(){const t=norm(q.value).split(/\s+/).filter(Boolean);$("x").hidden=!q.value;
const home=!t.length&&!f;$("hm").hidden=!home;$("rs").hidden=home;if(home)return;
const R=D.filter((d,i)=>(!f||d[0]===f)&&t.every(w=>I[i].includes(w)));
$("n").textContent=R.length+" kết quả"+(f?" trong “"+DOC[f][1]+"”":"");const L=$("l");L.innerHTML="";
if(!R.length){L.innerHTML='<div class="em">😕 Không tìm thấy. Thử từ khóa ngắn hơn hoặc bỏ dấu.</div>';return}
R.forEach(d=>{const v=DOC[d[0]],e=document.createElement("details");e.style.setProperty("--h",v[2]);if(t.length&&R.length<=5||!t.length&&R.length<=3)e.open=true;
const s=document.createElement("summary"),b=document.createElement("span");b.className="bd";b.textContent=v[0]+" "+v[1];
const h=document.createElement("div");hl(h,d[1],t);s.append(b,h);e.append(s,body(d[2],t));L.appendChild(e)})}
q.oninput=()=>{if(!q.value)f=f;r()};$("x").onclick=()=>{q.value="";r();q.focus()};
$("bk").onclick=()=>{f="";q.value="";r();scrollTo(0,0)};
$("ex").onclick=()=>{const ds=[...document.querySelectorAll("#l details")],o=ds.some(d=>!d.open);ds.forEach(d=>d.open=o)};
r();
</script></body></html>
